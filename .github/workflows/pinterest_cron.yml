name: Pinterest Auto-Publisher

on:
  schedule:
    # Този код означава: Всеки ден в 18:00 UTC (което е 21:00 часа в България)
    - cron: '0 18 * * *'
  # Това ни позволява да пускаме бота ръчно с бутон, за да го тестваме
  workflow_dispatch: 

jobs:
  publish_to_pinterest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow requests

      - name: Run Pinterest Bot
        env:
          PINTEREST_TOKEN: ${{ secrets.PINTEREST_TOKEN }}
        run: python pinterest_bot.py
