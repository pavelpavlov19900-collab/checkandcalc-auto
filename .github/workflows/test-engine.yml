name: 🧪 Test Data Engine

on:
  workflow_dispatch: # Това е магията - позволява ни да го пускаме ръчно с бутон

jobs:
  test-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install python-whois requests

      - name: Run Data Engine Script
        env:
          GOOGLE_SAFE_BROWSING_KEY: ${{ secrets.GOOGLE_SAFE_BROWSING_KEY }}
        run: python scripts/data_engine.py

      - name: Output the generated JSON reports
        run: |
          echo "=== REРОРТ ЗА AMAZON.COM ==="
          cat data/reports/amazon_com.json || true
          echo -e "\n=== REРОРТ ЗА ТЕСТОВИЯ ДОМЕЙН НА GOOGLE ==="
          cat data/reports/testsafebrowsing_appspot_com.json || true
