name: 🚑 SEO Healer
on: workflow_dispatch
jobs:
  heal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: python seo_healer.py
      - name: Commit fixes
        run: |
          git config --global user.name 'SEO Healer Bot'
          git config --global user.email 'healer@checkandcalc.com'
          git add .
          git commit -m "Auto-healed broken JSON-LD quotes" || echo "No changes to commit"
          git push
