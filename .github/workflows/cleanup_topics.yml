name: Cleanup Topics List
on:
  workflow_dispatch: 

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Run Cleanup Script
        run: python cleanup.py

      - name: Commit changes
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add topics.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated cleanup: Removed written topics" && git push)
