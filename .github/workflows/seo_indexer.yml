name: 🌍 SEO Sitemap Indexer (Bi-Weekly)

on:
  schedule:
    # Работи в 00:00 часа на 1-ви и 15-ти ден от всеки месец
    - cron: '0 0 1,15 * *'
  workflow_dispatch: # Позволява ръчно пускане с бутон

jobs:
  ping_search_engines:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Ping Google and Bing
      run: python sitemap_pinger.py
