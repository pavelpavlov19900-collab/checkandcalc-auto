name: Facebook Auto-Publisher Factory

on:
  schedule:
    # Работи всеки ден в 10:00 UTC (което е перфектно за сутрешен трафик в САЩ/Европа)
    - cron: '45 11 * * 1-5'
  workflow_dispatch: # Това създава бутон "Run workflow" за ръчно тестване

jobs:
  publish_to_facebook:
    runs-on: ubuntu-latest

    steps:
      - name: 🏭 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 🚀 Run Facebook Bot
        env:
          # Вземаме тайните от Settings и ги подаваме на скрипта
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python facebook_bot.py
