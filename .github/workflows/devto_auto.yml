name: Dev.to Auto Publisher

on:
  schedule:
    # Работи всеки ден в 12:30 UTC (08:30 Ню Йорк / 14:30 Европа)
    # Хваща перфектно ИТ специалистите, преди да започнат работа!
    - cron: '30 12 * * *'
  workflow_dispatch: # Бутон за ръчно стартиране
# 🚦 ТУК СЛАГАМЕ СВЕТОФАРА (ЕДНАКЪВ ЗА ВСИЧКИ 5 ФАЙЛА)
concurrency: factory_queue
jobs:
  publish_to_devto:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Dev.to Bot
        env:
          DEV_TO_TOKEN: ${{ secrets.DEV_TO_TOKEN }}
        run: python devto_bot.py

      - name: Save History to GitHub
        run: |
          git config --global user.name 'AI Factory'
          git config --global user.email 'factory@checkandcalc.com'
          git add devto_history.txt
          git commit -m "Update Dev.to history [skip ci]" || echo "No history changes to commit"
          git push origin main
